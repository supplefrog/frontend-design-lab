<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sondara · image design references</title>
<style>*{box-sizing:border-box}body{margin:0;background:#142e34;color:#e2eeee;font:16px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#142e34ee;backdrop-filter:blur(12px);padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}strong{margin-right:auto;font-weight:500}nav{display:flex;gap:8px}button,a{font:inherit;color:inherit}button{border:1px solid #61868b;background:transparent;border-radius:8px;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#d5f6df;color:#163b3d;border-color:#d5f6df}button:focus-visible,a:focus-visible{outline:3px solid #c8ee76;outline-offset:3px}a{color:#c9e9eb}main{padding:20px;display:grid;justify-items:center}img{display:block;max-width:100%;height:auto;box-shadow:0 14px 60px #04171988}img.phone{width:390px}p{max-width:75ch;margin:20px 0;color:#a9c5c9;font-size:14px}@media(max-width:600px){header{padding:12px;gap:10px}button{padding:8px 10px}main{padding:10px}}</style></head>
<body><header><strong>Sondara · image design references</strong><nav aria-label="Reference layout"><button type="button" data-view="desktop" aria-pressed="true">Desktop</button><button type="button" data-view="phone" aria-pressed="false">Phone</button><button type="button" data-view="states" aria-pressed="false">Controls</button></nav><a href="index.html">Working app</a></header><main><img id="reference" src="directions/b-ribbon.png" alt="Selected desktop visual reference: pale aqua Sondara audio library with translucent ribbons"><p id="caption">Native image design. Controls are illustrative. The working app uses the actual synthetic recording and its correct metadata.</p></main>
<script>const views={desktop:['directions/b-ribbon.png','Selected desktop visual reference: pale aqua Sondara audio library with translucent ribbons'],phone:['directions/mobile.png','Phone layout derived from the selected Sondara design'],states:['directions/states.png','Play, pause, replay, save, validation and excerpt component references']};const image=document.querySelector('#reference');for(const button of document.querySelectorAll('button[data-view]'))button.addEventListener('click',()=>{for(const other of document.querySelectorAll('button[data-view]'))other.setAttribute('aria-pressed',String(other===button));const view=button.dataset.view;image.src=views[view][0];image.alt=views[view][1];image.classList.toggle('phone',view==='phone');});</script></body></html>
